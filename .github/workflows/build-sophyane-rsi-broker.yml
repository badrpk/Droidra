name: Build Sophyane RSI Broker

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/sophyane-rsi-broker
    paths:
      - .github/workflows/build-sophyane-rsi-broker.yml
      - apps/sophyane-rsi-broker/**
      - tools/verify_broker_apk.py

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/sophyane-rsi-broker

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"

      # GitHub ubuntu-latest already provides Android SDK command-line tools.
      # Avoid setup-android v3 requesting the obsolete SDK package 'tools'.
      - name: Locate Android SDK tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install SDK 36
        run: |
          set -euo pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build unsigned release APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease

      - name: Diagnose packaged DEX (read-only)
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import hashlib
          import struct
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              for entry in z.infolist():
                  if not (entry.filename.startswith("classes") and entry.filename.endswith(".dex")):
                      continue
                  data = z.read(entry)
                  print("DEX_NAME=", entry.filename)
                  print("DEX_SIZE=", len(data))
                  print("DEX_SHA256=", hashlib.sha256(data).hexdigest())
                  print("DEX_MAGIC=", repr(data[:8]))
                  if len(data) >= 112 and data[:4] == bytes((100, 101, 120, 10)):
                      for name, offset in (
                          ("string_ids", 56),
                          ("type_ids", 64),
                          ("proto_ids", 72),
                          ("field_ids", 80),
                          ("method_ids", 88),
                          ("class_defs", 96),
                      ):
                          print("DEX_" + name.upper() + "_COUNT=", struct.unpack_from("<I", data, offset)[0])
          PY

      - name: Trace DEX class origin (read-only)
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          python3 - "$APK" <<'PY'
          import struct
          import sys
          import zipfile
          from pathlib import Path

          def inspect(data, label):
              if len(data) < 112 or data[:4] != bytes((100, 101, 120, 10)):
                  return
              string_count, string_offset = struct.unpack_from("<II", data, 56)
              type_count, type_offset = struct.unpack_from("<II", data, 64)
              class_count, class_offset = struct.unpack_from("<II", data, 96)
              def read_uleb(pos):
                  value = 0
                  for shift in range(0, 35, 7):
                      b = data[pos]
                      pos += 1
                      value |= (b & 127) << shift
                      if not b & 128:
                          return pos
                  raise ValueError("Invalid ULEB128")
              strings = []
              for i in range(string_count):
                  off = struct.unpack_from("<I", data, string_offset + 4*i)[0]
                  pos = read_uleb(off)
                  end = data.index(0, pos)
                  strings.append(data[pos:end].decode("utf-8", errors="replace"))
              types = [strings[struct.unpack_from("<I", data, type_offset + 4*i)[0]] for i in range(type_count)]
              print("DEX_ORIGIN=", label)
              print("DEX_ALL_STRINGS=", repr(strings))
              for i in range(class_count):
                  class_idx = struct.unpack_from("<I", data, class_offset + 32*i)[0]
                  print("DEX_CLASS_DESCRIPTOR=", types[class_idx])

          with zipfile.ZipFile(sys.argv[1]) as z:
              for name in z.namelist():
                  if name.endswith(".dex"):
                      inspect(z.read(name), "APK:" + name)
          root = Path("app/build/intermediates")
          for p in sorted(root.rglob("*.dex")):
              if p.is_file():
                  inspect(p.read_bytes(), str(p))
          PY

      - name: Inspect compiled APK
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          "$AAPT" dump badging "$APK" > apk-badging.txt
          "$AAPT" dump permissions "$APK" > apk-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt

          grep -q "package: name='com.sophyane.rsi.broker'" apk-badging.txt

          if grep -Eq 'uses-permission:|uses-permission-sdk-' apk-permissions.txt; then
            echo "Unexpected permission"
            exit 1
          fi

          if unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?[.]dex$'; then
            echo "Unexpected DEX"
            exit 1
          fi

          echo "BROKER_MANIFEST_XMLTREE_BEGIN"
          cat apk-manifest.txt
          echo "BROKER_MANIFEST_XMLTREE_END"

          python3 ../../tools/verify_broker_apk.py --unsigned-inspection "$APK" "$AAPT"

          sha256sum "$APK" > broker-release-unsigned.apk.sha256

          # CI metadata; not cryptographic attestation.
          {
            printf "source_sha=%s\n" "$GITHUB_SHA"
            printf "run_id=%s\n" "$GITHUB_RUN_ID"
            printf "run_attempt=%s\n" "$GITHUB_RUN_ATTEMPT"
            printf "repository=%s\n" "$GITHUB_REPOSITORY"
            printf "workflow=%s\n" "$GITHUB_WORKFLOW"
            printf "apk_sha256=%s\n" "$(sha256sum "$APK" | cut -d " " -f 1)"
          } > broker-build-provenance.txt

      - name: Upload unsigned inspection artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sophyane-rsi-broker-unsigned-inspection
          path: |
            apps/sophyane-rsi-broker/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/sophyane-rsi-broker/broker-release-unsigned.apk.sha256
            apps/sophyane-rsi-broker/broker-build-provenance.txt
            apps/sophyane-rsi-broker/apk-badging.txt
            apps/sophyane-rsi-broker/apk-permissions.txt
            apps/sophyane-rsi-broker/apk-manifest.txt
          if-no-files-found: error
          retention-days: 7
